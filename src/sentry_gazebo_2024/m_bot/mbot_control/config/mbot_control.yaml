# ROS2 controller-manager configuration.  The five namespaces and PID values
# retain the legacy mbot_control.yaml interface; commands are one-element
# Float64MultiArray messages because ros2_control group controllers require it.
mbot/controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster.type: joint_state_broadcaster/JointStateBroadcaster
    left_wheel_joint_controller.type: forward_command_controller/ForwardCommandController
    right_wheel_joint_controller.type: forward_command_controller/ForwardCommandController
mbot/left_wheel_joint_controller:
  ros__parameters:
    joints: [left_wheel_joint]
    interface_name: velocity
mbot/right_wheel_joint_controller:
  ros__parameters:
    joints: [right_wheel_joint]
    interface_name: velocity

mbot2/controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster.type: joint_state_broadcaster/JointStateBroadcaster
    left_wheel_joint_controller.type: forward_command_controller/ForwardCommandController
    right_wheel_joint_controller.type: forward_command_controller/ForwardCommandController
mbot2/left_wheel_joint_controller:
  ros__parameters: {joints: [left_wheel_joint], interface_name: velocity}
mbot2/right_wheel_joint_controller:
  ros__parameters: {joints: [right_wheel_joint], interface_name: velocity}

