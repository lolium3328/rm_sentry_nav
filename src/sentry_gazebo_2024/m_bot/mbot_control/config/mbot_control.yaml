# ROS2 controller-manager configuration.  The five namespaces and PID values
# retain the legacy mbot_control.yaml interface; commands are one-element
# Float64MultiArray messages because ros2_control group controllers require it.
mbot/controller_manager:
  ros__parameters:
    update_rate: 1000
    joint_state_broadcaster.type: joint_state_broadcaster/JointStateBroadcaster
    left_wheel_joint_controller.type: velocity_controllers/JointGroupVelocityController
    right_wheel_joint_controller.type: velocity_controllers/JointGroupVelocityController
mbot/left_wheel_joint_controller:
  ros__parameters:
    joints: [left_wheel_joint]
mbot/right_wheel_joint_controller:
  ros__parameters:
    joints: [right_wheel_joint]

